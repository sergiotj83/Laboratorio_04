<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vite + TS</title>
  </head>
  <body>
    <div id="app">
      <div class="turno-display">
        <h1 class="numero_turno">01</h1>
        <p class="texto_turno">Por favor, acérquese al mostrador</p>

        <div class="botones">
          <button class="boton" id="siguiente">Siguiente Turno</button>
          <button class="boton" id="reset">Resetear Turno</button>
          <button class="boton" id="anterior">Turno Anterior</button>
        </div>

        <div class="cambiar-turno">
          <input
            type="number"
            id="input-turno"
            placeholder="Introduce el turno"
          />
          <button id="cambiar">Cambiar turno</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
